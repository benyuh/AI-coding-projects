{#
render/templates/shared/base_styles.html
所有模板共享的 CSS 基础样式（通过 Jinja2 include 引入）
包含：全局/卡片/时间线/对比/流程图/图表/关系图 样式
#}
<style>
  /* ── CSS 变量（由 StyleTokens 注入）── */
  :root {
    {{ css_vars | default('') }}
  }
  /* ── 全局 ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    background: var(--color-bg, #FFF8F0);
    font-family: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .infographic {
    width: 1080px;
    padding: 40px 60px 60px;
    display: flex; flex-direction: column;
    gap: 24px;
    background: var(--color-bg, #FFF8F0);
  }
  /* ── 封面卡 ── */
  .card-cover {
    background: var(--cover-gradient, linear-gradient(135deg, #FF6B6B 0%, #FF8E53 50%, #FFB347 100%));
    border-radius: 28px; padding: 72px 60px 64px;
    color: #fff; position: relative; overflow: clip; min-height: 320px;
  }
  .card-cover::before {
    content: ""; position: absolute; top: -80px; right: -80px;
    width: 340px; height: 340px; border-radius: 50%;
    background: rgba(255,255,255,0.12); pointer-events: none;
  }
  .card-cover::after {
    content: ""; position: absolute; bottom: -60px; left: -60px;
    width: 240px; height: 240px; border-radius: 50%;
    background: rgba(255,255,255,0.08); pointer-events: none;
  }
  .card-cover--minimal { padding: 48px 60px 40px; min-height: 200px; }
  .cover-inner { position: relative; z-index: 1; }
  .card-cover .tag {
    display: inline-block; background: rgba(255,255,255,0.28);
    border-radius: 24px; padding: 8px 22px; font-size: 24px; font-weight: 600;
    letter-spacing: 0.06em; margin-bottom: 32px;
    backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.3);
  }
  .card-cover .main-title {
    font-size: 56px; font-weight: 900; line-height: 1.25;
    letter-spacing: -0.02em; margin-bottom: 24px; word-break: break-word;
  }
  .card-cover .subtitle {
    font-size: 26px; opacity: 0.88; font-weight: 400;
    line-height: 1.6; word-break: break-word;
  }
  .card-cover .cover-divider {
    width: 60px; height: 4px; background: rgba(255,255,255,0.5);
    border-radius: 2px; margin: 28px 0 0;
  }
  /* ── section/text_icon 卡 ── */
  .card-section {
    background: #fff; border-radius: var(--border-radius, 20px);
    padding: 40px 48px;
    box-shadow: var(--card-shadow, 0 2px 16px rgba(0,0,0,0.06));
    border-left: 8px solid var(--color-primary, #FF6B6B); overflow: hidden;
  }
  .card-section .card-icon { font-size: 36px; margin-bottom: 12px; }
  .card-section .card-title {
    font-size: 32px; font-weight: 700; color: #1A1A1A;
    line-height: 1.4; margin-bottom: 16px; word-break: break-word;
  }
  .card-section .card-body {
    font-size: var(--font-size-base, 26px); color: #444;
    line-height: 1.7; margin-bottom: 20px;
    word-break: break-word; overflow: hidden;
  }
  .card-section .items-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .card-section .items-list li {
    display: flex; align-items: flex-start; gap: 12px;
    font-size: 25px; color: #333; line-height: 1.6; word-break: break-word;
  }
  .card-section .items-list li::before {
    content: "•"; color: var(--color-primary, #FF6B6B);
    font-size: 28px; font-weight: 900; line-height: 1.4; flex-shrink: 0;
  }
  /* ── 数据卡 ── */
  .card-data {
    background: var(--data-gradient, linear-gradient(135deg, #1A1A2E 0%, #16213E 100%));
    border-radius: var(--border-radius, 20px); padding: 44px 48px;
    display: flex; align-items: center; gap: 40px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden;
  }
  .card-data .data-number-wrap { min-width: 160px; max-width: 280px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .card-data .data-number { font-size: 88px; font-weight: 900; color: var(--color-accent, #FFB347); line-height: 1; letter-spacing: -0.02em; word-break: break-all; max-width: 280px; }
  .card-data .data-number.long-number { font-size: 60px; }
  .card-data .data-number.very-long-number { font-size: 44px; }
  .card-data .data-text { flex: 1; overflow: hidden; }
  .card-data .data-title { font-size: 30px; font-weight: 700; color: #fff; margin-bottom: 12px; line-height: 1.4; word-break: break-word; }
  .card-data .data-desc { font-size: 24px; color: rgba(255,255,255,0.65); line-height: 1.6; word-break: break-word; overflow: hidden; }
  /* ── 时间线卡 ── */
  .card-timeline {
    background: #fff; border-radius: var(--border-radius, 20px); padding: 36px 48px;
    box-shadow: var(--card-shadow, 0 2px 16px rgba(0,0,0,0.06));
    display: flex; align-items: flex-start; gap: 36px; overflow: hidden;
  }
  .card-timeline .timeline-left { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; width: 96px; padding-top: 4px; }
  .card-timeline .timeline-badge { background: var(--cover-gradient, linear-gradient(135deg, #FF6B6B, #FF8E53)); border-radius: 14px; padding: 8px 10px; text-align: center; min-width: 80px; }
  .card-timeline .timeline-time-text { font-size: 20px; font-weight: 800; color: #fff; line-height: 1.3; letter-spacing: 0.02em; }
  .card-timeline .timeline-axis { width: 3px; min-height: 40px; flex: 1; background: linear-gradient(to bottom, rgba(255,107,107,0.27), transparent); margin-top: 8px; border-radius: 2px; }
  .card-timeline .timeline-content { flex: 1; overflow: hidden; }
  .card-timeline .card-title { font-size: 30px; font-weight: 700; color: #1A1A1A; margin-bottom: 12px; line-height: 1.4; word-break: break-word; }
  .card-timeline .card-body { font-size: 25px; color: #555; line-height: 1.7; word-break: break-word; overflow: hidden; }
  /* ── 总结卡 ── */
  .card-summary {
    background: var(--summary-gradient, linear-gradient(135deg, #667EEA 0%, #764BA2 100%));
    border-radius: 28px; padding: 48px 52px; color: #fff;
    box-shadow: 0 4px 24px rgba(102,126,234,0.38); position: relative; overflow: hidden;
  }
  .card-summary::before { content: ""; position: absolute; top: -60px; right: -60px; width: 240px; height: 240px; border-radius: 50%; background: rgba(255,255,255,0.08); pointer-events: none; }
  .card-summary .summary-inner { position: relative; z-index: 1; }
  .card-summary .summary-label { font-size: 22px; font-weight: 700; opacity: 0.85; letter-spacing: 0.10em; margin-bottom: 20px; }
  .card-summary .card-title { font-size: 36px; font-weight: 800; line-height: 1.4; margin-bottom: 18px; word-break: break-word; }
  .card-summary .card-body { font-size: 26px; opacity: 0.92; line-height: 1.7; margin-bottom: 28px; word-break: break-word; overflow: hidden; }
  .card-summary .items-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
  .card-summary .items-list li { display: flex; align-items: flex-start; gap: 14px; font-size: 25px; opacity: 0.94; line-height: 1.6; word-break: break-word; }
  .card-summary .items-list li::before { content: "✓"; font-weight: 900; flex-shrink: 0; font-size: 22px; margin-top: 3px; background: rgba(255,255,255,0.2); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .card-summary .summary-footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.25); font-size: 20px; opacity: 0.65; letter-spacing: 0.05em; font-weight: 500; }
  /* ── 对比卡 ── */
  .card-comparison {
    background: #fff; border-radius: var(--border-radius, 20px); padding: 36px 48px;
    box-shadow: var(--card-shadow, 0 2px 16px rgba(0,0,0,0.06)); overflow: hidden;
  }
  .card-comparison .comparison-title { font-size: 32px; font-weight: 700; color: #1A1A1A; margin-bottom: 24px; }
  .comparison-grid { display: flex; gap: 0; align-items: stretch; }
  .comparison-col { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .comparison-header { font-size: 22px; font-weight: 700; padding: 12px 16px; border-radius: 8px; text-align: center; }
  .comparison-col--left .comparison-header { background: var(--color-primary, #FF6B6B); color: #fff; }
  .comparison-col--right .comparison-header { background: var(--color-secondary, #667EEA); color: #fff; }
  .comparison-cell { font-size: 24px; color: #333; padding: 10px 16px; line-height: 1.5; word-break: break-word; border-bottom: 1px solid #f0f0f0; }
  .comparison-divider { width: 3px; background: #f0f0f0; margin: 0 16px; border-radius: 2px; }
  /* ── 流程图卡 ── */
  .card-flow { padding: 36px 48px; }
  .flow-steps { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
  .flow-steps--vertical { flex-direction: column; align-items: flex-start; }
  .flow-step { display: flex; align-items: center; gap: 12px; background: #f8f8f8; border-radius: 12px; padding: 14px 20px; flex: 1; min-width: 160px; }
  .flow-step-number { width: 36px; height: 36px; border-radius: 50%; background: var(--color-primary, #FF6B6B); color: #fff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .flow-step-text { font-size: 22px; color: #333; line-height: 1.4; word-break: break-word; }
  .flow-arrow { font-size: 28px; color: var(--color-primary, #FF6B6B); font-weight: 700; flex-shrink: 0; }
  /* ── 图表卡 ── */
  .card-chart .chart-container { margin-top: 16px; display: flex; justify-content: center; }
  /* ── 关系图卡 ── */
  .card-entity-graph { padding: 36px 48px; }
  /* ── 页脚 ── */
  .footer { text-align: center; padding: 8px 0 0; font-size: 20px; color: #bbb; letter-spacing: 0.04em; }
</style>
