# render/styles/xiaohongshu_warm.yaml
# 小红书暖色风格（v3.1.4）
# 特点：珊瑚粉 + 奶油白，圆润，温暖亲切

style_id: xiaohongshu_warm

# ── 颜色系统 ──────────────────────────────────────────────────────────────
primary_color: "#FF6B9D"
secondary_color: "#FF8FAB"
accent_color: "#FFB3C1"
background_color: "#FFF5F7"
text_color: "#1A1A1A"
text_secondary_color: "#555555"
text_muted_color: "#999999"

# ── 排版 ──────────────────────────────────────────────────────────────────
font_family: "PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif"
font_size_base: 26
font_size_title: 32
font_size_cover: 52
font_size_data: 80
line_height: 1.75

# ── 间距与圆角 ────────────────────────────────────────────────────────────
border_radius: 24
border_radius_cover: 32
padding_card: "36px 44px"
card_gap: 20

# ── 阴影 ──────────────────────────────────────────────────────────────────
card_shadow: "0 4px 20px rgba(255,107,157,0.12)"
cover_shadow: "0 8px 40px rgba(255,107,157,0.28)"

# ── 渐变 ──────────────────────────────────────────────────────────────────
cover_gradient: "linear-gradient(135deg, #FF6B9D 0%, #FF8FAB 50%, #FFB3C1 100%)"
data_gradient: "linear-gradient(135deg, #2D1B35 0%, #4A2040 100%)"
summary_gradient: "linear-gradient(135deg, #FF6B9D 0%, #C44569 100%)"

# ── 边框 ──────────────────────────────────────────────────────────────────
section_border_left_color: "#FF6B9D"
section_border_left_width: 8
